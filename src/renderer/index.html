<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="./assets/icon.ico" />
  <link href="./css/styles.css" rel="stylesheet">
  <!-- <link href="./src/style.css" rel="stylesheet"> -->
  <title>N0Launcher</title>
</head>
<body class="launcher-body">
  <div class="flex-screen">
    <!-- Sidebar -->
    <div class="sidebar">
      
      <div id="auth-header">
        <button id="auth-btn">
          <i id="auth-icon" class="fas fa-user"></i>
          <span>Đăng nhập</span>
        </button>
      </div>
      
      <nav class="nav">
        <button onclick="showPage('home')" class="nav-btn active">
          <i class="fas fa-home"></i> <span id="nav-label-home">Trang chủ</span>
        </button>
        <button onclick="showPage('versions')" class="nav-btn">
          <i class="fas fa-list"></i> <span id="nav-label-versions">Phiên bản</span>
        </button>
        <button onclick="showPage('mods')" class="nav-btn">
          <i class="fas fa-puzzle-piece"></i> <span id="nav-label-mods">Mods &amp; Resource Packs</span>
        </button>
        <button onclick="showPage('settings')" class="nav-btn">
          <i class="fas fa-cog"></i> <span id="nav-label-settings">Cài đặt</span>
        </button>
      </nav>

      <div class="mt-auto"></div>

      <!-- Footer Version -->
      <div class="sidebar-footer">
        N0Launcher <span class="version">v1.0.5</span><br>
        <span class="credit" id="sidebar-credit">Made with ❤️ for Minecraft</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="content">
      <!-- Trang chủ sẽ có background Minecraft -->
    </div>
  </div>

  <!-- Thanh tiến trình -->
  <div id="progress-container">
    <div class="progress-header">
      <span id="progress-label">Đang chuẩn bị...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-bar">
      <div id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Thông báo cập nhật -->
  <div id="update-banner">
    <div class="update-banner-icon"><i class="fas fa-rocket"></i></div>
    <div class="update-banner-body">
      <p class="update-banner-title" id="update-banner-title"></p>
      <p class="update-banner-desc" id="update-banner-desc"></p>
      <div class="update-banner-progress" id="update-banner-progress-wrap">
        <div class="update-banner-progress-fill" id="update-banner-progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="update-banner-actions" id="update-banner-actions"></div>
    <button class="update-banner-close" onclick="window.dismissUpdateBanner()" title="Đóng">
      <i class="fas fa-xmark"></i>
    </button>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
